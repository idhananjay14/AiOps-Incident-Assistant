[project]
name = "aiops-incident-assistant"
version = "0.1.0"
description = "Evidence-driven AIOps incident response platform"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlalchemy",
    "psycopg[binary]",
    "pydantic-settings",
    "alembic",
    "python-json-logger",
    "prometheus-client",
]
requires-python = ">=3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff.lint]
ignore = ["B008"]
