apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
  namespace: aiops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: app
  template:
    metadata:
      labels:
        app: app
    spec:
      enableServiceLinks: false
      automountServiceAccountToken: false
      containers:
        - name: app
          image: aiops-incident-assistant-app:security
          imagePullPolicy: IfNotPresent
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 8000
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-credentials
                  key: POSTGRES_PASSWORD
            - name: DATABASE_URL
              value: "postgresql+psycopg://aiops:$(POSTGRES_PASSWORD)@postgres:5432/aiops"
            - name: FAILURE_MODE
              value: "normal"
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: app
  namespace: aiops
spec:
  selector:
    app: app
  ports:
    - port: 8000
      targetPort: 8000
  type: ClusterIP
