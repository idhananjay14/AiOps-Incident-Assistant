apiVersion: v1
data:
  loki.yml: |
    apiVersion: 1

    datasources:
      - name: Loki
        type: loki
        uid: loki
        access: proxy
        url: http://loki:3100
        editable: true
  prometheus.yml: |
    apiVersion: 1

    datasources:
      - name: Prometheus
        type: prometheus
        uid: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
        editable: true
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: aiops
